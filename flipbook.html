<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Flipbook Reader - Data Science Digital Library</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- PageFlip 3D Book Library -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <style>
        body {
            background-color: #020617;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 3D Realistic Book Styling */
        #book-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: calc(100vh - 72px);
            position: relative;
            perspective: 1500px;
        }

        .flip-book {
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(20, 184, 166, 0.15);
            background: #0f172a;
            border-radius: 6px;
        }

        .page {
            background-color: #ffffff;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .page-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #ffffff;
            position: relative;
        }

        .page-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .page-footer {
            position: absolute;
            bottom: 6px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 10px;
            font-family: 'Fira Code', monospace;
            color: #64748b;
            pointer-events: none;
        }

        /* Hard cover styles */
        .page.--hard {
            background-color: #0b1329 !important;
            border: 2px solid #14b8a6;
        }

        .page.--hard .cover-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            background: linear-gradient(135deg, #070b19 0%, #0d1a33 100%);
            color: #ffffff;
        }

        /* Floating Nav Buttons */
        .nav-floating-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(7, 11, 25, 0.85);
            border: 1px solid rgba(45, 212, 191, 0.4);
            color: #2dd4bf;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 30;
            backdrop-filter: blur(8px);
        }

        .nav-floating-btn:hover {
            background: #2dd4bf;
            color: #020617;
            transform: translateY(-50%) scale(1.08);
            box-shadow: 0 0 25px rgba(45, 212, 191, 0.6);
        }

        .nav-prev-btn { left: 24px; }
        .nav-next-btn { right: 24px; }

        @media (max-width: 768px) {
            .nav-prev-btn { left: 8px; width: 40px; height: 40px; font-size: 14px; }
            .nav-next-btn { right: 8px; width: 40px; height: 40px; font-size: 14px; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: rgba(20, 184, 166, 0.4); border-radius: 9999px; }
    </style>
</head>
<body class="bg-[#020617] min-h-screen flex flex-col">

    <!-- Top Navigation Toolbar -->
    <header class="h-[72px] bg-[#070b19]/95 backdrop-blur-md border-b border-teal-500/20 px-4 md:px-8 flex items-center justify-between sticky top-0 z-50">
        <!-- Back to Library & Title -->
        <div class="flex items-center space-x-4 min-w-0">
            <a href="index.html" class="flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-teal-500/10 hover:bg-teal-500/20 text-teal-300 border border-teal-500/30 text-xs font-semibold transition" title="Return to Data Science Digital Library">
                <i class="fa-solid fa-arrow-left"></i>
                <span class="hidden sm:inline">Digital Library</span>
            </a>
            <div class="truncate">
                <div class="flex items-center space-x-2">
                    <span class="px-2 py-0.5 rounded-full bg-teal-500/10 text-teal-400 font-mono text-[10px] border border-teal-500/30 uppercase font-bold tracking-wider">3D Flipbook</span>
                    <h1 id="book-title" class="text-xs md:text-sm font-extrabold text-white truncate max-w-xs md:max-w-md">Data Science Module Syllabus</h1>
                </div>
                <p class="text-[10px] text-slate-400 hidden sm:block">Click or drag page corners to turn pages • Use arrow keys ← →</p>
            </div>
        </div>

        <!-- Page Indicator & Controls -->
        <div class="flex items-center space-x-2 md:space-x-3">
            <div class="flex items-center space-x-1.5 bg-[#020617] px-3 py-1.5 rounded-xl border border-teal-500/30 text-xs font-mono">
                <span class="text-slate-400">Page</span>
                <span id="current-page" class="font-bold text-teal-400">1</span>
                <span class="text-slate-500">/</span>
                <span id="total-pages" class="text-slate-300">--</span>
            </div>

            <!-- Page flip sound toggle -->
            <button onclick="toggleSound()" id="btn-sound" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-teal-400 border border-slate-700 text-xs transition" title="Toggle Page Turn Sound">
                <i class="fa-solid fa-volume-high" id="sound-icon"></i>
            </button>

            <!-- Fullscreen Toggle -->
            <button onclick="toggleFullscreen()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 text-xs transition hidden sm:inline-block" title="Toggle Fullscreen View">
                <i class="fa-solid fa-expand"></i>
            </button>

            <!-- Download PDF Button -->
            <a id="btn-download" href="#" download class="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-teal-400 to-emerald-400 text-slate-950 font-extrabold text-xs flex items-center space-x-1.5 shadow-md hover:opacity-90 transition">
                <i class="fa-solid fa-download text-xs"></i>
                <span class="hidden md:inline">Download PDF</span>
            </a>

            <!-- Standard PDF View Toggle -->
            <button onclick="toggleStandardView()" id="btn-toggle-view" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 text-xs transition" title="Switch to Standard PDF Viewer">
                <i class="fa-solid fa-file-pdf text-rose-400"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 relative flex flex-col justify-center items-center overflow-hidden">
        
        <!-- Loading Progress Overlay -->
        <div id="loading-overlay" class="absolute inset-0 bg-[#020617] z-40 flex flex-col items-center justify-center p-6 space-y-4">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-teal-400 to-emerald-400 flex items-center justify-center text-slate-950 font-bold text-2xl shadow-xl shadow-teal-500/20 animate-bounce">
                <i class="fa-solid fa-book-open-reader"></i>
            </div>
            <div class="text-center space-y-1">
                <h3 class="text-base font-extrabold text-white">Preparing Your Interactive Flipbook...</h3>
                <p id="loading-status-text" class="text-xs text-teal-400 font-mono">Loading PDF pages from Digital Library...</p>
            </div>
            <div class="w-64 bg-slate-800 h-2 rounded-full overflow-hidden border border-teal-500/30">
                <div id="loading-progress-bar" class="h-full bg-gradient-to-r from-teal-400 to-emerald-400 transition-all duration-200" style="width: 5%;"></div>
            </div>
        </div>

        <!-- Floating Flip Buttons -->
        <button onclick="prevPage()" id="btn-prev-float" class="nav-floating-btn nav-prev-btn" title="Previous Page (←)">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button onclick="nextPage()" id="btn-next-float" class="nav-floating-btn nav-next-btn" title="Next Page (→)">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <!-- Flipbook Container -->
        <div id="book-container">
            <div id="flipbook" class="flip-book">
                <!-- Pages injected dynamically by JavaScript -->
            </div>
        </div>

        <!-- Fallback Standard PDF View Container (Hidden by default) -->
        <div id="standard-pdf-container" class="w-full h-full absolute inset-0 bg-[#020617] hidden z-30">
            <iframe id="standard-pdf-iframe" src="" class="w-full h-full border-0"></iframe>
        </div>
    </main>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // 1. Parse URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        let pdfFile = urlParams.get('pdf') || urlParams.get('file') || 'Module1.pdf';
        let pdfTitle = urlParams.get('title') || 'Data Science Syllabus Module';

        // Clean parameters
        pdfFile = decodeURIComponent(pdfFile);
        pdfTitle = decodeURIComponent(pdfTitle);

        document.getElementById('book-title').innerText = pdfTitle;
        document.title = `${pdfTitle} (Interactive Flipbook) - Data Science Digital Library`;

        const downloadBtn = document.getElementById('btn-download');
        downloadBtn.href = pdfFile;
        downloadBtn.download = pdfFile;

        let pageFlipInstance = null;
        let soundEnabled = true;
        let totalPdfPages = 0;
        let isStandardView = false;

        // 2. Realistic Audio Synthesizer (Zero External Audio File Dependency)
        function playFlipSound() {
            if (!soundEnabled) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') ctx.resume();

                const bufferSize = Math.floor(ctx.sampleRate * 0.11);
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const decay = Math.exp(-i / (ctx.sampleRate * 0.03));
                    data[i] = (Math.random() * 2 - 1) * decay * 0.3;
                }

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1400;
                filter.Q.value = 1.3;

                noise.connect(filter);
                filter.connect(ctx.destination);
                noise.start();
            } catch(e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-teal-400';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-slate-500';
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function toggleStandardView() {
            const flipContainer = document.getElementById('book-container');
            const stdContainer = document.getElementById('standard-pdf-container');
            const floatPrev = document.getElementById('btn-prev-float');
            const floatNext = document.getElementById('btn-next-float');
            const btn = document.getElementById('btn-toggle-view');

            isStandardView = !isStandardView;
            if (isStandardView) {
                document.getElementById('standard-pdf-iframe').src = pdfFile;
                stdContainer.classList.remove('hidden');
                flipContainer.classList.add('hidden');
                floatPrev.classList.add('hidden');
                floatNext.classList.add('hidden');
                btn.innerHTML = `<i class="fa-solid fa-book-open text-teal-400"></i>`;
                btn.title = "Switch to 3D Flipbook Reader";
            } else {
                stdContainer.classList.add('hidden');
                flipContainer.classList.remove('hidden');
                floatPrev.classList.remove('hidden');
                floatNext.classList.remove('hidden');
                btn.innerHTML = `<i class="fa-solid fa-file-pdf text-rose-400"></i>`;
                btn.title = "Switch to Standard PDF Viewer";
            }
        }

        function prevPage() {
            if (pageFlipInstance) {
                pageFlipInstance.flipPrev();
            }
        }

        function nextPage() {
            if (pageFlipInstance) {
                pageFlipInstance.flipNext();
            }
        }

        // Keyboard navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
                nextPage();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevPage();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            }
        });

        // 3. Render PDF Pages & Mount St.PageFlip
        async function loadFlipbook() {
            const statusText = document.getElementById('loading-status-text');
            const progressBar = document.getElementById('loading-progress-bar');
            const flipbookEl = document.getElementById('flipbook');

            try {
                statusText.innerText = `Fetching ${pdfFile}...`;
                const loadingTask = pdfjsLib.getDocument(pdfFile);
                const pdfDoc = await loadingTask.promise;
                totalPdfPages = pdfDoc.numPages;
                document.getElementById('total-pages').innerText = totalPdfPages;

                flipbookEl.innerHTML = '';

                // Responsive sizing calculations
                const containerWidth = window.innerWidth;
                const containerHeight = window.innerHeight - 72;
                
                // Base page dimension (Standard A4 ratio: 1 : 1.414)
                let basePageWidth = 520;
                let basePageHeight = 735;

                if (containerWidth < 768) {
                    basePageWidth = Math.min(containerWidth * 0.92, 420);
                    basePageHeight = basePageWidth * 1.414;
                } else if (containerHeight < 800) {
                    basePageHeight = containerHeight * 0.88;
                    basePageWidth = basePageHeight / 1.414;
                }

                // Render each PDF page
                for (let i = 1; i <= totalPdfPages; i++) {
                    const pct = Math.round((i / totalPdfPages) * 100);
                    progressBar.style.width = `${pct}%`;
                    statusText.innerText = `Rendering page ${i} of ${totalPdfPages} (${pct}%)...`;

                    const page = await pdfDoc.getPage(i);
                    // High-DPI rendering for crystal clear text readability
                    const viewport = page.getViewport({ scale: 1.8 });

                    const canvas = document.createElement('canvas');
                    canvas.className = 'page-canvas';
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    const ctx = canvas.getContext('2d');

                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    if (i === 1 || i === totalPdfPages) {
                        pageDiv.setAttribute('data-density', 'hard');
                    } else {
                        pageDiv.setAttribute('data-density', 'soft');
                    }

                    const pageContent = document.createElement('div');
                    pageContent.className = 'page-content';
                    pageContent.appendChild(canvas);

                    const pageFooter = document.createElement('div');
                    pageFooter.className = 'page-footer';
                    pageFooter.innerText = `Page ${i}`;
                    pageContent.appendChild(pageFooter);

                    pageDiv.appendChild(pageContent);
                    flipbookEl.appendChild(pageDiv);
                }

                statusText.innerText = 'Initializing 3D Flipbook Engine...';

                // Initialize St.PageFlip
                pageFlipInstance = new St.PageFlip(flipbookEl, {
                    width: Math.round(basePageWidth),
                    height: Math.round(basePageHeight),
                    size: 'stretch',
                    minWidth: 280,
                    maxWidth: 1000,
                    minHeight: 400,
                    maxHeight: 1400,
                    maxShadowOpacity: 0.6,
                    showCover: true,
                    mobileScrollSupport: false,
                    useMouseEvents: true,
                    clickEventForward: true,
                    swipeDistance: 35
                });

                pageFlipInstance.loadFromHTML(document.querySelectorAll('.page'));

                pageFlipInstance.on('flip', (e) => {
                    const currentIdx = e.data;
                    document.getElementById('current-page').innerText = currentIdx + 1;
                    playFlipSound();
                });

                pageFlipInstance.on('changeState', (e) => {
                    if (e.data === 'flipping') {
                        playFlipSound();
                    }
                });

                // Dismiss loading overlay smoothly
                setTimeout(() => {
                    const overlay = document.getElementById('loading-overlay');
                    overlay.style.transition = 'opacity 0.4s ease';
                    overlay.style.opacity = '0';
                    setTimeout(() => overlay.remove(), 400);
                }, 300);

            } catch (err) {
                console.error("Flipbook error:", err);
                statusText.innerText = "Direct flipbook rendering encountered an issue. Switching to standard viewer...";
                setTimeout(() => {
                    toggleStandardView();
                    const overlay = document.getElementById('loading-overlay');
                    if (overlay) overlay.remove();
                }, 1000);
            }
        }

        window.addEventListener('load', loadFlipbook);
    </script>
</body>
</html>
