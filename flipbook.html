<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>3D Module Flipbook - Data Science Digital Library</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- PageFlip 3D Book Library -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <style>
        body {
            background: radial-gradient(ellipse at 50% 40%, #08142b 0%, #020617 80%);
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            min-height: 100vh;
        }

        /* 3D Realistic Book Styling */
        #book-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: calc(100vh - 72px);
            position: relative;
            padding: 16px;
        }

        .flip-book {
            box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.9), 0 0 50px rgba(45, 212, 191, 0.2);
            background: #0f172a;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        .page {
            background-color: #ffffff;
            overflow: hidden;
            box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        .page-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            position: relative;
        }

        .page-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .page-footer {
            position: absolute;
            bottom: 6px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 10px;
            font-family: 'Fira Code', monospace;
            color: #64748b;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.7);
            padding: 2px 0;
        }

        /* Hard cover styles */
        .page.--hard {
            background-color: #0b1329 !important;
            border: 2px solid #14b8a6;
        }

        /* Floating Nav Buttons */
        .nav-floating-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(7, 11, 25, 0.85);
            border: 1px solid rgba(45, 212, 191, 0.4);
            color: #2dd4bf;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            z-index: 30;
            backdrop-filter: blur(8px);
        }

        .nav-floating-btn:hover {
            background: #2dd4bf;
            color: #020617;
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 0 30px rgba(45, 212, 191, 0.6);
        }

        .nav-prev-btn { left: 20px; }
        .nav-next-btn { right: 20px; }

        @media (max-width: 768px) {
            .nav-prev-btn { left: 6px; width: 40px; height: 40px; font-size: 14px; }
            .nav-next-btn { right: 6px; width: 40px; height: 40px; font-size: 14px; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: rgba(20, 184, 166, 0.4); border-radius: 9999px; }
    </style>
</head>
<body class="bg-[#020617] min-h-screen flex flex-col">

    <!-- Top Navigation Toolbar -->
    <header class="h-[72px] bg-[#070b19]/90 backdrop-blur-md border-b border-teal-500/20 px-4 md:px-8 flex items-center justify-between sticky top-0 z-50 shadow-md">
        <!-- Back to Library & Title -->
        <div class="flex items-center space-x-4 min-w-0">
            <a href="index.html" class="flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-teal-500/10 hover:bg-teal-500/20 text-teal-300 border border-teal-500/30 text-xs font-semibold transition" title="Return to Data Science Digital Library">
                <i class="fa-solid fa-arrow-left"></i>
                <span class="hidden sm:inline">Digital Library</span>
            </a>
            <div class="truncate">
                <div class="flex items-center space-x-2">
                    <span class="px-2 py-0.5 rounded-full bg-teal-500/10 text-teal-400 font-mono text-[10px] border border-teal-500/30 uppercase font-bold tracking-wider">3D Flipbook</span>
                    <h1 id="book-title" class="text-xs md:text-sm font-extrabold text-white truncate max-w-xs md:max-w-md">Data Science Module Syllabus</h1>
                </div>
                <p id="background-cache-status" class="text-[10px] text-teal-400/80 hidden sm:block font-mono">Single page mode • Click corners or use arrows ← →</p>
            </div>
        </div>

        <!-- Page Indicator & Controls -->
        <div class="flex items-center space-x-2 md:space-x-3">
            <!-- Page Indicator -->
            <div class="flex items-center space-x-1.5 bg-[#020617] px-3 py-1.5 rounded-xl border border-teal-500/30 text-xs font-mono shadow-sm">
                <span class="text-slate-400">Page</span>
                <span id="current-page" class="font-bold text-teal-400">1</span>
                <span class="text-slate-500">/</span>
                <span id="total-pages" class="text-slate-300">--</span>
            </div>

            <!-- Single Page / 2-Page Spread Mode Toggle -->
            <button onclick="togglePageSpread()" id="btn-spread" class="px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-teal-300 border border-slate-700 text-xs font-semibold flex items-center space-x-1.5 transition hidden sm:flex" title="Toggle Single Page / Double Page Mode">
                <i class="fa-solid fa-file" id="spread-icon"></i>
                <span id="spread-label">Single Page</span>
            </button>

            <!-- Page flip sound toggle -->
            <button onclick="toggleSound()" id="btn-sound" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-teal-400 border border-slate-700 text-xs transition" title="Toggle Page Turn Sound">
                <i class="fa-solid fa-volume-high" id="sound-icon"></i>
            </button>

            <!-- Fullscreen Toggle -->
            <button onclick="toggleFullscreen()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 text-xs transition hidden sm:inline-block" title="Toggle Fullscreen View">
                <i class="fa-solid fa-expand"></i>
            </button>

            <!-- Download PDF Button -->
            <a id="btn-download" href="#" download class="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-teal-400 to-emerald-400 text-slate-950 font-extrabold text-xs flex items-center space-x-1.5 shadow-md hover:opacity-90 transition">
                <i class="fa-solid fa-download text-xs"></i>
                <span class="hidden md:inline">Download</span>
            </a>

            <!-- Standard PDF View Toggle -->
            <button onclick="toggleStandardView()" id="btn-toggle-view" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 text-xs transition" title="Switch to Standard PDF Viewer">
                <i class="fa-solid fa-file-pdf text-rose-400"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 relative flex flex-col justify-center items-center overflow-hidden">
        
        <!-- Ultra-fast Initial Loading Spinner (Dismisses in < 0.5s!) -->
        <div id="loading-overlay" class="absolute inset-0 bg-[#020617] z-40 flex flex-col items-center justify-center p-6 space-y-4">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-teal-400 to-emerald-400 flex items-center justify-center text-slate-950 font-bold text-2xl shadow-xl shadow-teal-500/30 animate-pulse">
                <i class="fa-solid fa-book-open"></i>
            </div>
            <div class="text-center space-y-1">
                <h3 class="text-base font-extrabold text-white">Opening 3D Flipbook...</h3>
                <p id="loading-status-text" class="text-xs text-teal-400 font-mono">Loading first page...</p>
            </div>
            <div class="w-56 bg-slate-800 h-1.5 rounded-full overflow-hidden border border-teal-500/30">
                <div id="loading-progress-bar" class="h-full bg-gradient-to-r from-teal-400 to-emerald-400 transition-all duration-150" style="width: 25%;"></div>
            </div>
        </div>

        <!-- Floating Flip Buttons -->
        <button onclick="prevPage()" id="btn-prev-float" class="nav-floating-btn nav-prev-btn" title="Previous Page (←)">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button onclick="nextPage()" id="btn-next-float" class="nav-floating-btn nav-next-btn" title="Next Page (→)">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <!-- Flipbook Container -->
        <div id="book-container">
            <div id="flipbook" class="flip-book">
                <!-- Pages injected dynamically by JavaScript -->
            </div>
        </div>

        <!-- Fallback Standard PDF View Container (Hidden by default) -->
        <div id="standard-pdf-container" class="w-full h-full absolute inset-0 bg-[#020617] hidden z-30">
            <iframe id="standard-pdf-iframe" src="" class="w-full h-full border-0"></iframe>
        </div>
    </main>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // 1. Parse URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        let pdfFile = urlParams.get('pdf') || urlParams.get('file') || 'Module1.pdf';
        let pdfTitle = urlParams.get('title') || 'Data Science Syllabus Module';

        pdfFile = decodeURIComponent(pdfFile);
        pdfTitle = decodeURIComponent(pdfTitle);

        document.getElementById('book-title').innerText = pdfTitle;
        document.title = `${pdfTitle} (Interactive Flipbook) - Data Science Digital Library`;

        const downloadBtn = document.getElementById('btn-download');
        downloadBtn.href = pdfFile;
        downloadBtn.download = pdfFile;

        let pageFlipInstance = null;
        let soundEnabled = true;
        let totalPdfPages = 0;
        let isStandardView = false;
        let isSinglePageMode = true; // Default: Single page view ("one page after another")!
        let pdfDocGlobal = null;
        let renderedPages = new Set();

        // 2. Realistic Audio Synthesizer (Zero External Audio File Dependency)
        function playFlipSound() {
            if (!soundEnabled) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') ctx.resume();

                const bufferSize = Math.floor(ctx.sampleRate * 0.1);
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const decay = Math.exp(-i / (ctx.sampleRate * 0.025));
                    data[i] = (Math.random() * 2 - 1) * decay * 0.25;
                }

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1350;
                filter.Q.value = 1.4;

                noise.connect(filter);
                filter.connect(ctx.destination);
                noise.start();
            } catch(e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-teal-400';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-slate-500';
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function toggleStandardView() {
            const flipContainer = document.getElementById('book-container');
            const stdContainer = document.getElementById('standard-pdf-container');
            const floatPrev = document.getElementById('btn-prev-float');
            const floatNext = document.getElementById('btn-next-float');
            const btn = document.getElementById('btn-toggle-view');

            isStandardView = !isStandardView;
            if (isStandardView) {
                document.getElementById('standard-pdf-iframe').src = pdfFile;
                stdContainer.classList.remove('hidden');
                flipContainer.classList.add('hidden');
                floatPrev.classList.add('hidden');
                floatNext.classList.add('hidden');
                btn.innerHTML = `<i class="fa-solid fa-book-open text-teal-400"></i>`;
                btn.title = "Switch to 3D Flipbook Reader";
            } else {
                stdContainer.classList.add('hidden');
                flipContainer.classList.remove('hidden');
                floatPrev.classList.remove('hidden');
                floatNext.classList.remove('hidden');
                btn.innerHTML = `<i class="fa-solid fa-file-pdf text-rose-400"></i>`;
                btn.title = "Switch to Standard PDF Viewer";
            }
        }

        function togglePageSpread() {
            isSinglePageMode = !isSinglePageMode;
            const label = document.getElementById('spread-label');
            const icon = document.getElementById('spread-icon');

            if (isSinglePageMode) {
                label.innerText = 'Single Page';
                icon.className = 'fa-solid fa-file';
            } else {
                label.innerText = 'Two Pages';
                icon.className = 'fa-solid fa-book-open';
            }

            // Reload flipbook with new orientation
            initPageFlip();
        }

        function prevPage() {
            if (pageFlipInstance) {
                pageFlipInstance.flipPrev();
            }
        }

        function nextPage() {
            if (pageFlipInstance) {
                pageFlipInstance.flipNext();
            }
        }

        // Keyboard navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
                nextPage();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevPage();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            }
        });

        // 3. Fast Asynchronous Single Page Renderer
        async function renderSinglePdfPage(pageNum) {
            if (renderedPages.has(pageNum) || !pdfDocGlobal) return;
            const canvas = document.getElementById(`page-canvas-${pageNum}`);
            if (!canvas) return;

            try {
                const page = await pdfDocGlobal.getPage(pageNum);
                // Balanced scale for crystal clarity and instant rendering
                const viewport = page.getViewport({ scale: 1.4 });
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                const ctx = canvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                renderedPages.add(pageNum);
            } catch(e) {
                console.warn(`Page ${pageNum} render notice:`, e);
            }
        }

        // 4. Initialize St.PageFlip
        function initPageFlip() {
            const flipbookEl = document.getElementById('flipbook');
            if (pageFlipInstance) {
                try { pageFlipInstance.destroy(); } catch(e) {}
            }

            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight - 72;
            
            // Standard A4 aspect ratio 1 : 1.414
            let basePageWidth = 520;
            let basePageHeight = 735;

            if (isSinglePageMode || containerWidth < 900) {
                // Generous, large single page reading size
                basePageHeight = Math.min(containerHeight * 0.90, 860);
                basePageWidth = basePageHeight / 1.414;
                if (basePageWidth > containerWidth * 0.92) {
                    basePageWidth = containerWidth * 0.92;
                    basePageHeight = basePageWidth * 1.414;
                }
            } else {
                basePageHeight = Math.min(containerHeight * 0.88, 760);
                basePageWidth = basePageHeight / 1.414;
            }

            pageFlipInstance = new St.PageFlip(flipbookEl, {
                width: Math.round(basePageWidth),
                height: Math.round(basePageHeight),
                size: 'stretch',
                minWidth: 280,
                maxWidth: 1000,
                minHeight: 400,
                maxHeight: 1400,
                maxShadowOpacity: 0.5,
                showCover: !isSinglePageMode,
                mobileScrollSupport: false,
                useMouseEvents: true,
                clickEventForward: true,
                usePortrait: isSinglePageMode, // "one page after another" single page view!
                swipeDistance: 25
            });

            pageFlipInstance.loadFromHTML(document.querySelectorAll('.page'));

            pageFlipInstance.on('flip', (e) => {
                const currentIdx = e.data;
                document.getElementById('current-page').innerText = currentIdx + 1;
                playFlipSound();

                // Proactively pre-render next 3 pages in advance
                const targetPage = currentIdx + 1;
                for (let p = targetPage; p <= Math.min(targetPage + 3, totalPdfPages); p++) {
                    renderSinglePdfPage(p);
                }
            });

            pageFlipInstance.on('changeState', (e) => {
                if (e.data === 'flipping') {
                    playFlipSound();
                }
            });
        }

        // 5. Lightning Fast Initializer: Renders Page 1 immediately, opens book, streams rest in background!
        async function loadFlipbookFast() {
            const statusText = document.getElementById('loading-status-text');
            const progressBar = document.getElementById('loading-progress-bar');
            const flipbookEl = document.getElementById('flipbook');

            try {
                statusText.innerText = `Fetching ${pdfFile}...`;
                progressBar.style.width = '40%';
                
                const loadingTask = pdfjsLib.getDocument(pdfFile);
                pdfDocGlobal = await loadingTask.promise;
                totalPdfPages = pdfDocGlobal.numPages;
                document.getElementById('total-pages').innerText = totalPdfPages;

                flipbookEl.innerHTML = '';

                // Build lightweight page DOM shells instantly
                for (let i = 1; i <= totalPdfPages; i++) {
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    pageDiv.id = `page-wrapper-${i}`;

                    const pageContent = document.createElement('div');
                    pageContent.className = 'page-content';

                    const canvas = document.createElement('canvas');
                    canvas.id = `page-canvas-${i}`;
                    canvas.className = 'page-canvas';
                    pageContent.appendChild(canvas);

                    const pageFooter = document.createElement('div');
                    pageFooter.className = 'page-footer';
                    pageFooter.innerText = `Page ${i}`;
                    pageContent.appendChild(pageFooter);

                    pageDiv.appendChild(pageContent);
                    flipbookEl.appendChild(pageDiv);
                }

                statusText.innerText = 'Rendering Page 1...';
                progressBar.style.width = '70%';

                // Render Page 1 and Page 2 right now (< 200ms!)
                await renderSinglePdfPage(1);
                if (totalPdfPages > 1) {
                    await renderSinglePdfPage(2);
                }

                progressBar.style.width = '100%';
                statusText.innerText = 'Ready!';

                // Initialize 3D book immediately!
                initPageFlip();

                // Dismiss loading screen right away!
                setTimeout(() => {
                    const overlay = document.getElementById('loading-overlay');
                    if (overlay) {
                        overlay.style.transition = 'opacity 0.25s ease';
                        overlay.style.opacity = '0';
                        setTimeout(() => overlay.remove(), 250);
                    }
                }, 100);

                // Stream render remaining pages in background without blocking user
                (async function streamRemainingPages() {
                    for (let p = 3; p <= totalPdfPages; p++) {
                        await renderSinglePdfPage(p);
                        const cachedCount = renderedPages.size;
                        const statusEl = document.getElementById('background-cache-status');
                        if (statusEl && cachedCount < totalPdfPages) {
                            statusEl.innerText = `Pages ready: ${cachedCount}/${totalPdfPages} • One page after another mode`;
                        } else if (statusEl) {
                            statusEl.innerText = `All ${totalPdfPages} pages ready • Single page 3D mode`;
                        }
                    }
                })();

            } catch (err) {
                console.error("Flipbook error:", err);
                statusText.innerText = "Switching to standard PDF viewer...";
                setTimeout(() => {
                    toggleStandardView();
                    const overlay = document.getElementById('loading-overlay');
                    if (overlay) overlay.remove();
                }, 500);
            }
        }

        window.addEventListener('load', loadFlipbookFast);
        window.addEventListener('resize', () => {
            if (pageFlipInstance) {
                initPageFlip();
            }
        });
    </script>
</body>
</html>
