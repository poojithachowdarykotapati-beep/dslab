<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>3D Module Flipbook - Data Science Digital Library</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- PageFlip 3D Engine -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <style>
        /* CSS Reset & Base */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #020617;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* Top Fixed Navigation Bar */
        .top-navbar {
            height: 56px;
            min-height: 56px;
            width: 100%;
            background: rgba(7, 11, 25, 0.98);
            border-bottom: 1px solid rgba(45, 212, 191, 0.25);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 12px;
            border-radius: 10px;
            background: rgba(45, 212, 191, 0.12);
            border: 1px solid rgba(45, 212, 191, 0.35);
            color: #2dd4bf;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-back:hover {
            background: rgba(45, 212, 191, 0.25);
            color: #ffffff;
            border-color: #2dd4bf;
            transform: translateX(-2px);
        }

        .title-block {
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 0;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .badge-flipbook {
            padding: 2px 7px;
            border-radius: 9999px;
            background: rgba(45, 212, 191, 0.15);
            color: #2dd4bf;
            font-family: 'Fira Code', monospace;
            font-size: 10px;
            font-weight: 700;
            border: 1px solid rgba(45, 212, 191, 0.3);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .book-title {
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 360px;
            margin: 0;
        }

        .cache-status {
            font-size: 10px;
            color: #5eead4;
            opacity: 0.85;
            font-family: 'Fira Code', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 360px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-ctrl {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 10px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-ctrl:hover {
            background: #334155;
            color: #ffffff;
            border-color: rgba(45, 212, 191, 0.4);
        }

        .btn-ctrl.active-mode {
            background: rgba(45, 212, 191, 0.18);
            border-color: #2dd4bf;
            color: #2dd4bf;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 10px;
            background: linear-gradient(135deg, #2dd4bf 0%, #34d399 100%);
            color: #020617;
            font-size: 12px;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(45, 212, 191, 0.35);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-download:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        /* Main Workspace Stage */
        .main-stage {
            flex: 1;
            width: 100%;
            height: calc(100vh - 56px);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0d1b38 0%, #060e22 55%, #020617 100%);
        }

        /* Flipbook Stage Container: Dead Center, Zero Overflow */
        #book-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 8px;
        }

        .flip-book {
            box-shadow: 0 20px 60px -10px rgba(0, 0, 0, 0.95), 0 0 40px rgba(45, 212, 191, 0.12);
            border-radius: 6px;
            background: #0f172a;
            margin: auto;
        }

        /* Page styling: Pure White Crisp Document Sheets */
        .page {
            background-color: #ffffff !important;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.09);
        }

        .page-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            position: relative;
        }

        .page-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #ffffff;
        }

        .page-footer {
            position: absolute;
            bottom: 4px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 9px;
            font-family: 'Fira Code', monospace;
            font-weight: 600;
            color: #64748b;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.9);
            padding: 1px 0;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Floating Nav Buttons (Side Chevrons) */
        .nav-floating-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(7, 11, 25, 0.92);
            border: 1.5px solid rgba(45, 212, 191, 0.45);
            color: #2dd4bf;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
            z-index: 50;
            backdrop-filter: blur(8px);
        }

        .nav-floating-btn:hover {
            background: #2dd4bf;
            color: #020617;
            transform: translateY(-50%) scale(1.12);
            box-shadow: 0 0 25px rgba(45, 212, 191, 0.7);
        }

        .nav-prev-btn { left: 16px; }
        .nav-next-btn { right: 16px; }

        /* Bottom Floating Control Bar (Always Accessible & Visible) */
        .bottom-controls-bar {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(7, 11, 25, 0.94);
            border: 1px solid rgba(45, 212, 191, 0.35);
            padding: 5px 16px;
            border-radius: 9999px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            z-index: 60;
            backdrop-filter: blur(10px);
        }

        .btn-bottom-nav {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: 9999px;
            background: rgba(45, 212, 191, 0.12);
            border: 1px solid rgba(45, 212, 191, 0.35);
            color: #2dd4bf;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-bottom-nav:hover {
            background: #2dd4bf;
            color: #020617;
            transform: translateY(-1px);
        }

        .bottom-page-text {
            font-size: 11px;
            font-family: 'Fira Code', monospace;
            font-weight: 600;
            color: #cbd5e1;
            white-space: nowrap;
        }

        .bottom-page-text span.active-num {
            color: #2dd4bf;
            font-weight: 700;
        }

        /* Fullscreen Overlay for Loading */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .loading-icon-box {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2dd4bf 0%, #34d399 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #020617;
            font-size: 24px;
            box-shadow: 0 0 35px rgba(45, 212, 191, 0.45);
            animation: pulse-glow 1.5s infinite alternate;
        }

        @keyframes pulse-glow {
            from { transform: scale(0.96); box-shadow: 0 0 20px rgba(45, 212, 191, 0.3); }
            to { transform: scale(1.05); box-shadow: 0 0 45px rgba(45, 212, 191, 0.7); }
        }

        .loading-title {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
        }

        .loading-desc {
            font-size: 11px;
            color: #2dd4bf;
            font-family: 'Fira Code', monospace;
        }

        .loading-bar-track {
            width: 220px;
            height: 5px;
            border-radius: 9999px;
            background: #1e293b;
            overflow: hidden;
            border: 1px solid rgba(45, 212, 191, 0.3);
        }

        .loading-bar-fill {
            height: 100%;
            width: 20%;
            background: linear-gradient(90deg, #2dd4bf, #34d399);
            transition: width 0.15s ease;
        }

        /* Fallback Standard PDF View Container */
        #standard-pdf-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #020617;
            z-index: 40;
            display: none;
        }

        #standard-pdf-iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Responsive styling */
        .hidden { display: none !important; }

        @media (max-width: 900px) {
            .book-title { max-width: 180px; }
            .cache-status { display: none; }
            .nav-prev-btn { left: 8px; width: 40px; height: 40px; font-size: 15px; }
            .nav-next-btn { right: 8px; width: 40px; height: 40px; font-size: 15px; }
            .btn-ctrl span { display: none; }
        }

        @media (max-width: 600px) {
            .top-navbar { padding: 0 10px; }
            .btn-back span { display: none; }
            .book-title { max-width: 130px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- Fixed Top Navigation Toolbar -->
    <header class="top-navbar">
        <!-- Left: Back to Library & Book Title -->
        <div class="nav-left">
            <a href="index.html" class="btn-back" title="Return to Data Science Digital Library">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Digital Library</span>
            </a>
            <div class="title-block">
                <div class="title-row">
                    <span class="badge-flipbook">3D FLIPBOOK</span>
                    <h1 id="book-title" class="book-title">Data Science Module Syllabus</h1>
                </div>
                <p id="background-cache-status" class="cache-status">One page after another mode • Click edges or buttons to flip</p>
            </div>
        </div>

        <!-- Right: Mode Switcher & Action Controls -->
        <div class="nav-right">
            <!-- Single Page / Two Pages Mode Switcher (100% Functional!) -->
            <button onclick="togglePageSpread()" id="btn-spread" class="btn-ctrl active-mode" title="Toggle Single Page / Double Page Mode">
                <i class="fa-solid fa-file" id="spread-icon"></i>
                <span id="spread-label">Single Page</span>
            </button>

            <!-- Audio Sound Toggle -->
            <button onclick="toggleSound()" id="btn-sound" class="btn-ctrl" title="Toggle Page Flip Sound">
                <i class="fa-solid fa-volume-high" id="sound-icon" style="color: #2dd4bf;"></i>
            </button>

            <!-- Fullscreen View Toggle -->
            <button onclick="toggleFullscreen()" class="btn-ctrl" title="Toggle Fullscreen Mode">
                <i class="fa-solid fa-expand"></i>
            </button>

            <!-- Download Official PDF -->
            <a id="btn-download" href="#" download class="btn-download" title="Download official PDF document">
                <i class="fa-solid fa-download"></i>
                <span>Download</span>
            </a>

            <!-- Standard PDF Reader Fallback -->
            <button onclick="toggleStandardView()" id="btn-toggle-view" class="btn-ctrl" title="Switch to Standard PDF Viewer">
                <i class="fa-solid fa-file-pdf" style="color: #fb7185;"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace Stage -->
    <main class="main-stage">
        <!-- Floating Navigation Prev / Next Buttons (Large Chevrons) -->
        <button onclick="prevPage()" id="btn-prev-float" class="nav-floating-btn nav-prev-btn" title="Previous Page (←)">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button onclick="nextPage()" id="btn-next-float" class="nav-floating-btn nav-next-btn" title="Next Page (→)">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <!-- 3D Flipbook Mount -->
        <div id="book-container">
            <div id="flipbook" class="flip-book">
                <!-- Pages injected dynamically by JavaScript -->
            </div>
        </div>

        <!-- Bottom Controls Bar (Quick Next/Prev + Page Counter) -->
        <div class="bottom-controls-bar">
            <button onclick="prevPage()" class="btn-bottom-nav">
                <i class="fa-solid fa-chevron-left"></i> Prev
            </button>
            <div class="bottom-page-text">
                Page <span id="current-page" class="active-num">1</span> / <span id="total-pages">--</span>
            </div>
            <button onclick="nextPage()" class="btn-bottom-nav">
                Next <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <!-- Standard PDF View Container (Fallback) -->
        <div id="standard-pdf-container">
            <iframe id="standard-pdf-iframe" src=""></iframe>
        </div>
    </main>

    <!-- Instant Loading Screen Overlay (Dismisses in <250ms) -->
    <div id="loading-overlay">
        <div class="loading-icon-box">
            <i class="fa-solid fa-book-open"></i>
        </div>
        <div style="text-align: center;">
            <h3 class="loading-title">Opening 3D Flipbook...</h3>
            <p id="loading-status-text" class="loading-desc">Rendering page 1...</p>
        </div>
        <div class="loading-bar-track">
            <div id="loading-progress-bar" class="loading-bar-fill"></div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // 1. Parse URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        let pdfFile = urlParams.get('pdf') || urlParams.get('file') || 'Module1.pdf';
        let pdfTitle = urlParams.get('title') || 'Data Science Syllabus Module';

        pdfFile = decodeURIComponent(pdfFile);
        pdfTitle = decodeURIComponent(pdfTitle);

        document.getElementById('book-title').innerText = pdfTitle;
        document.title = `${pdfTitle} (Interactive Flipbook) - Data Science Digital Library`;

        const downloadBtn = document.getElementById('btn-download');
        downloadBtn.href = pdfFile;
        downloadBtn.download = pdfFile;

        let pageFlipInstance = null;
        let soundEnabled = true;
        let totalPdfPages = 0;
        let isStandardView = false;
        let isSinglePageMode = true; // Default: Single Page (One page after another)
        let pdfDocGlobal = null;
        let pdfDocAspect = 0.707; // Default A4 aspect ratio (width / height)
        let pageCanvases = {}; // In-memory cached canvas map { pageNum: HTMLCanvasElement }
        let renderedPages = new Set();

        // 2. Realistic Audio Synthesizer (Zero External Audio File Dependency)
        function playFlipSound() {
            if (!soundEnabled) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') ctx.resume();

                const bufferSize = Math.floor(ctx.sampleRate * 0.08);
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const decay = Math.exp(-i / (ctx.sampleRate * 0.02));
                    data[i] = (Math.random() * 2 - 1) * decay * 0.22;
                }

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1400;
                filter.Q.value = 1.5;

                noise.connect(filter);
                filter.connect(ctx.destination);
                noise.start();
            } catch(e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high';
                icon.style.color = '#2dd4bf';
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
                icon.style.color = '#64748b';
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function toggleStandardView() {
            const flipContainer = document.getElementById('book-container');
            const stdContainer = document.getElementById('standard-pdf-container');
            const floatPrev = document.getElementById('btn-prev-float');
            const floatNext = document.getElementById('btn-next-float');
            const btn = document.getElementById('btn-toggle-view');

            isStandardView = !isStandardView;
            if (isStandardView) {
                document.getElementById('standard-pdf-iframe').src = pdfFile;
                stdContainer.style.display = 'block';
                flipContainer.style.display = 'none';
                floatPrev.classList.add('hidden');
                floatNext.classList.add('hidden');
                btn.innerHTML = `<i class="fa-solid fa-book-open" style="color: #2dd4bf;"></i>`;
                btn.title = "Switch to 3D Flipbook Reader";
            } else {
                stdContainer.style.display = 'none';
                flipContainer.style.display = 'flex';
                floatPrev.classList.remove('hidden');
                floatNext.classList.remove('hidden');
                btn.innerHTML = `<i class="fa-solid fa-file-pdf" style="color: #fb7185;"></i>`;
                btn.title = "Switch to Standard PDF Viewer";
            }
        }

        function prevPage() {
            if (pageFlipInstance) {
                pageFlipInstance.flipPrev();
            }
        }

        function nextPage() {
            if (pageFlipInstance) {
                pageFlipInstance.flipNext();
            }
        }

        // Keyboard navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
                nextPage();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevPage();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            }
        });

        // 3. Fast Asynchronous Single Page Renderer
        async function renderSinglePdfPage(pageNum) {
            if (renderedPages.has(pageNum) || !pdfDocGlobal) return;
            try {
                const page = await pdfDocGlobal.getPage(pageNum);
                // Balanced scale for crisp text readability
                const viewport = page.getViewport({ scale: 1.6 });

                // Detect actual PDF aspect ratio from Page 1
                if (pageNum === 1 && viewport.width && viewport.height) {
                    pdfDocAspect = viewport.width / viewport.height;
                }

                const offCanvas = document.createElement('canvas');
                offCanvas.width = viewport.width;
                offCanvas.height = viewport.height;
                const ctx = offCanvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                pageCanvases[pageNum] = offCanvas;
                renderedPages.add(pageNum);

                // Copy to visible DOM canvas if it already exists
                const domCanvas = document.getElementById(`page-canvas-${pageNum}`);
                if (domCanvas) {
                    domCanvas.width = offCanvas.width;
                    domCanvas.height = offCanvas.height;
                    const dCtx = domCanvas.getContext('2d');
                    dCtx.drawImage(offCanvas, 0, 0);
                }
            } catch(e) {
                console.warn(`Page ${pageNum} render notice:`, e);
            }
        }

        // 4. Rebuild DOM and Mount St.PageFlip (Guarantees zero crashes & perfect fitting)
        function rebuildAndMountFlipbook(targetPageIdx = 0) {
            if (pageFlipInstance) {
                try { pageFlipInstance.destroy(); } catch(e) {}
                pageFlipInstance = null;
            }

            const container = document.getElementById('book-container');
            container.innerHTML = '<div id="flipbook" class="flip-book"></div>';
            const flipbookEl = document.getElementById('flipbook');

            // Inject pages
            for (let i = 1; i <= totalPdfPages; i++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';
                pageDiv.id = `page-wrapper-${i}`;

                const pageContent = document.createElement('div');
                pageContent.className = 'page-content';

                const canvas = document.createElement('canvas');
                canvas.id = `page-canvas-${i}`;
                canvas.className = 'page-canvas';

                // If already cached, draw instantly!
                if (pageCanvases[i]) {
                    canvas.width = pageCanvases[i].width;
                    canvas.height = pageCanvases[i].height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(pageCanvases[i], 0, 0);
                }

                pageContent.appendChild(canvas);

                const pageFooter = document.createElement('div');
                pageFooter.className = 'page-footer';
                pageFooter.innerText = `Page ${i}`;
                pageContent.appendChild(pageFooter);

                pageDiv.appendChild(pageContent);
                flipbookEl.appendChild(pageDiv);
            }

            // Screen Available Dimensions
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight - 56; // 56px top header
            const availH = containerHeight - 52; // 52px for bottom controls & breathing margin
            const availW = containerWidth - 120; // 120px for side floating buttons
            const aspect = pdfDocAspect || 0.707;

            let pageWidth, pageHeight;

            if (isSinglePageMode) {
                // SINGLE PAGE MODE (One page after another)
                pageHeight = availH;
                pageWidth = Math.round(pageHeight * aspect);

                if (pageWidth > availW) {
                    pageWidth = availW;
                    pageHeight = Math.round(pageWidth / aspect);
                }

                // Explicit container sizing prevents any stretching or blowing up!
                flipbookEl.style.width = pageWidth + 'px';
                flipbookEl.style.height = pageHeight + 'px';

                pageFlipInstance = new St.PageFlip(flipbookEl, {
                    width: pageWidth,
                    height: pageHeight,
                    size: 'fixed',
                    minWidth: pageWidth,
                    maxWidth: pageWidth,
                    minHeight: pageHeight,
                    maxHeight: pageHeight,
                    autoSize: false,
                    showCover: false, // Single page mode flips page by page cleanly
                    usePortrait: true, // Forces single-page portrait layout!
                    maxShadowOpacity: 0.5,
                    mobileScrollSupport: false,
                    useMouseEvents: true,
                    clickEventForward: true,
                    swipeDistance: 20,
                    startPage: targetPageIdx
                });
            } else {
                // TWO PAGES LANDSCAPE SPREAD MODE
                let spreadW = Math.round(availW / 2);
                let spreadH = Math.round(spreadW / aspect);

                if (spreadH > availH) {
                    spreadH = availH;
                    spreadW = Math.round(spreadH * aspect);
                }

                pageWidth = spreadW;
                pageHeight = spreadH;

                flipbookEl.style.width = (spreadW * 2) + 'px';
                flipbookEl.style.height = spreadH + 'px';

                pageFlipInstance = new St.PageFlip(flipbookEl, {
                    width: pageWidth,
                    height: pageHeight,
                    size: 'fixed',
                    minWidth: pageWidth,
                    maxWidth: pageWidth,
                    minHeight: pageHeight,
                    maxHeight: pageHeight,
                    autoSize: false,
                    showCover: true, // Book cover + 2-page spreads
                    usePortrait: false,
                    maxShadowOpacity: 0.5,
                    mobileScrollSupport: false,
                    useMouseEvents: true,
                    clickEventForward: true,
                    swipeDistance: 20,
                    startPage: targetPageIdx
                });
            }

            pageFlipInstance.loadFromHTML(document.querySelectorAll('.page'));

            pageFlipInstance.on('flip', (e) => {
                const currentIdx = e.data;
                document.getElementById('current-page').innerText = currentIdx + 1;
                playFlipSound();

                // Proactively pre-render next 4 pages in advance
                for (let p = currentIdx + 1; p <= Math.min(currentIdx + 4, totalPdfPages); p++) {
                    renderSinglePdfPage(p);
                }
            });

            pageFlipInstance.on('changeState', (e) => {
                if (e.data === 'flipping') {
                    playFlipSound();
                }
            });
        }

        // 5. Toggle Single Page / Two Pages Spread Mode
        function togglePageSpread() {
            isSinglePageMode = !isSinglePageMode;
            const btn = document.getElementById('btn-spread');
            const label = document.getElementById('spread-label');
            const icon = document.getElementById('spread-icon');
            const statusEl = document.getElementById('background-cache-status');

            if (isSinglePageMode) {
                label.innerText = 'Single Page';
                icon.className = 'fa-solid fa-file';
                btn.classList.add('active-mode');
                if (statusEl) statusEl.innerText = 'One page after another mode • Click edges or buttons to flip';
            } else {
                label.innerText = 'Two Pages';
                icon.className = 'fa-solid fa-book-open';
                btn.classList.remove('active-mode');
                if (statusEl) statusEl.innerText = 'Two pages open book spread • Click edges or buttons to flip';
            }

            const currentIdx = pageFlipInstance ? pageFlipInstance.getCurrentPageIndex() : 0;
            rebuildAndMountFlipbook(currentIdx);
        }

        // 6. Lightning Fast Initializer: Renders Page 1 immediately, opens book, streams rest in background!
        async function loadFlipbookFast() {
            const statusText = document.getElementById('loading-status-text');
            const progressBar = document.getElementById('loading-progress-bar');

            try {
                statusText.innerText = `Fetching ${pdfFile}...`;
                progressBar.style.width = '35%';
                
                const loadingTask = pdfjsLib.getDocument(pdfFile);
                pdfDocGlobal = await loadingTask.promise;
                totalPdfPages = pdfDocGlobal.numPages;
                document.getElementById('total-pages').innerText = totalPdfPages;

                statusText.innerText = 'Rendering Page 1...';
                progressBar.style.width = '70%';

                // Render Page 1 and Page 2 right now (< 200ms!)
                await renderSinglePdfPage(1);
                if (totalPdfPages > 1) {
                    await renderSinglePdfPage(2);
                }

                progressBar.style.width = '100%';
                statusText.innerText = 'Ready!';

                // Initialize 3D book immediately!
                rebuildAndMountFlipbook(0);

                // Dismiss loading screen right away!
                setTimeout(() => {
                    const overlay = document.getElementById('loading-overlay');
                    if (overlay) {
                        overlay.style.transition = 'opacity 0.25s ease';
                        overlay.style.opacity = '0';
                        setTimeout(() => overlay.remove(), 250);
                    }
                }, 100);

                // Stream render remaining pages in background without blocking user
                (async function streamRemainingPages() {
                    for (let p = 3; p <= totalPdfPages; p++) {
                        await renderSinglePdfPage(p);
                    }
                })();

            } catch (err) {
                console.error("Flipbook error:", err);
                statusText.innerText = "Switching to standard PDF viewer...";
                setTimeout(() => {
                    toggleStandardView();
                    const overlay = document.getElementById('loading-overlay');
                    if (overlay) overlay.remove();
                }, 500);
            }
        }

        window.addEventListener('load', loadFlipbookFast);
        window.addEventListener('resize', () => {
            if (pageFlipInstance) {
                const currentIdx = pageFlipInstance.getCurrentPageIndex();
                rebuildAndMountFlipbook(currentIdx);
            }
        });
    </script>
</body>
</html>
