<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>3D Module Flipbook - Data Science Digital Library</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- PageFlip 3D Book Engine -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <style>
        /* CSS Reset & Base */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #020617;
            background-color: #020617;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* Fixed Top Navigation Bar */
        .top-navbar {
            height: 64px;
            min-height: 64px;
            width: 100%;
            background: rgba(7, 11, 25, 0.96);
            border-bottom: 1px solid rgba(45, 212, 191, 0.25);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-radius: 12px;
            background: rgba(45, 212, 191, 0.1);
            border: 1px solid rgba(45, 212, 191, 0.35);
            color: #2dd4bf;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-back:hover {
            background: rgba(45, 212, 191, 0.2);
            color: #ffffff;
            border-color: #2dd4bf;
            transform: translateX(-2px);
        }

        .title-block {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .badge-flipbook {
            padding: 2px 8px;
            border-radius: 9999px;
            background: rgba(45, 212, 191, 0.12);
            color: #2dd4bf;
            font-family: 'Fira Code', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.05em;
            border: 1px solid rgba(45, 212, 191, 0.3);
            text-transform: uppercase;
            white-space: nowrap;
        }

        .book-title {
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 440px;
            margin: 0;
            letter-spacing: -0.01em;
        }

        .cache-status {
            font-size: 11px;
            color: #5eead4;
            opacity: 0.85;
            font-family: 'Fira Code', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 440px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 12px;
            background: #020617;
            border: 1px solid rgba(45, 212, 191, 0.3);
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            color: #94a3b8;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
        }

        .page-pill .curr {
            color: #2dd4bf;
            font-weight: 700;
        }

        .page-pill .tot {
            color: #f1f5f9;
        }

        .btn-ctrl {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            border-radius: 12px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-ctrl:hover {
            background: #334155;
            color: #ffffff;
            border-color: rgba(45, 212, 191, 0.4);
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2dd4bf 0%, #34d399 100%);
            color: #020617;
            font-size: 12px;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(45, 212, 191, 0.35);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-download:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(45, 212, 191, 0.5);
        }

        /* Main Workspace Stage */
        .main-stage {
            flex: 1;
            width: 100%;
            height: calc(100vh - 64px);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Premium digital desk ambient gradient */
            background: radial-gradient(circle at 50% 48%, #0d1b38 0%, #060e22 55%, #020617 100%);
        }

        /* Subtle ambient backdrop grid or glow behind book */
        .stage-backdrop-glow {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(45, 212, 191, 0.08) 0%, rgba(13, 27, 56, 0) 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* Flipbook Container */
        #book-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 18px;
        }

        .flip-book {
            box-shadow: 0 25px 65px -10px rgba(0, 0, 0, 0.95), 0 0 45px rgba(45, 212, 191, 0.12);
            border-radius: 6px;
            background: #0f172a;
            transition: transform 0.25s ease;
        }

        /* Page styling: Pure White Crisp Document Sheets */
        .page {
            background-color: #ffffff !important;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.07);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .page-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            position: relative;
        }

        .page-canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #ffffff;
        }

        .page-footer {
            position: absolute;
            bottom: 6px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 10px;
            font-family: 'Fira Code', monospace;
            font-weight: 600;
            color: #64748b;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(4px);
            padding: 2px 0;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
        }

        /* Floating Nav Buttons */
        .nav-floating-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(7, 11, 25, 0.9);
            border: 1.5px solid rgba(45, 212, 191, 0.45);
            color: #2dd4bf;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
            z-index: 50;
            backdrop-filter: blur(10px);
        }

        .nav-floating-btn:hover {
            background: #2dd4bf;
            color: #020617;
            transform: translateY(-50%) scale(1.12);
            box-shadow: 0 0 30px rgba(45, 212, 191, 0.7);
        }

        .nav-prev-btn { left: 24px; }
        .nav-next-btn { right: 24px; }

        /* Fullscreen Overlay for Loading */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .loading-icon-box {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: linear-gradient(135deg, #2dd4bf 0%, #34d399 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #020617;
            font-size: 26px;
            box-shadow: 0 0 35px rgba(45, 212, 191, 0.45);
            animation: pulse-glow 1.5s infinite alternate;
        }

        @keyframes pulse-glow {
            from { transform: scale(0.96); box-shadow: 0 0 20px rgba(45, 212, 191, 0.3); }
            to { transform: scale(1.05); box-shadow: 0 0 45px rgba(45, 212, 191, 0.7); }
        }

        .loading-title {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        .loading-desc {
            font-size: 12px;
            color: #2dd4bf;
            font-family: 'Fira Code', monospace;
        }

        .loading-bar-track {
            width: 240px;
            height: 6px;
            border-radius: 9999px;
            background: #1e293b;
            overflow: hidden;
            border: 1px solid rgba(45, 212, 191, 0.3);
        }

        .loading-bar-fill {
            height: 100%;
            width: 20%;
            background: linear-gradient(90deg, #2dd4bf, #34d399);
            transition: width 0.15s ease;
        }

        /* Fallback Standard PDF View Container */
        #standard-pdf-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #020617;
            z-index: 40;
            display: none;
        }

        #standard-pdf-iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Bottom watermark pill */
        .bottom-watermark {
            position: absolute;
            bottom: 12px;
            font-size: 10px;
            font-family: 'Fira Code', monospace;
            color: rgba(148, 163, 184, 0.5);
            pointer-events: none;
            z-index: 5;
            letter-spacing: 0.05em;
        }

        /* Utility classes */
        .hidden { display: none !important; }

        @media (max-width: 900px) {
            .book-title { max-width: 200px; }
            .cache-status { display: none; }
            .nav-prev-btn { left: 8px; width: 42px; height: 42px; font-size: 15px; }
            .nav-next-btn { right: 8px; width: 42px; height: 42px; font-size: 15px; }
            .btn-ctrl span { display: none; }
        }

        @media (max-width: 600px) {
            .top-navbar { padding: 0 12px; }
            .btn-back span { display: none; }
            .book-title { max-width: 140px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- Fixed Top Navigation Toolbar -->
    <header class="top-navbar">
        <!-- Left: Back to Library & Book Title -->
        <div class="nav-left">
            <a href="index.html" class="btn-back" title="Return to Data Science Digital Library">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Digital Library</span>
            </a>
            <div class="title-block">
                <div class="title-row">
                    <span class="badge-flipbook">3D FLIPBOOK</span>
                    <h1 id="book-title" class="book-title">Data Science Module Syllabus</h1>
                </div>
                <p id="background-cache-status" class="cache-status">Single page mode • Click corners or use arrows ← →</p>
            </div>
        </div>

        <!-- Right: Page Pill & Action Controls -->
        <div class="nav-right">
            <!-- Page Number Indicator -->
            <div class="page-pill">
                <span>Page</span>
                <span id="current-page" class="curr">1</span>
                <span>/</span>
                <span id="total-pages" class="tot">--</span>
            </div>

            <!-- Single Page / Two Pages Mode Switcher -->
            <button onclick="togglePageSpread()" id="btn-spread" class="btn-ctrl" title="Toggle Single Page / Double Page Mode">
                <i class="fa-solid fa-file" id="spread-icon"></i>
                <span id="spread-label">Single Page</span>
            </button>

            <!-- Audio Sound Toggle -->
            <button onclick="toggleSound()" id="btn-sound" class="btn-ctrl" title="Toggle Page Flip Sound">
                <i class="fa-solid fa-volume-high" id="sound-icon" style="color: #2dd4bf;"></i>
            </button>

            <!-- Fullscreen View Toggle -->
            <button onclick="toggleFullscreen()" class="btn-ctrl" title="Toggle Fullscreen Mode">
                <i class="fa-solid fa-expand"></i>
            </button>

            <!-- Download Official PDF -->
            <a id="btn-download" href="#" download class="btn-download" title="Download official PDF document">
                <i class="fa-solid fa-download"></i>
                <span>Download</span>
            </a>

            <!-- Standard PDF Reader Fallback -->
            <button onclick="toggleStandardView()" id="btn-toggle-view" class="btn-ctrl" title="Switch to Standard PDF Viewer">
                <i class="fa-solid fa-file-pdf" style="color: #fb7185;"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace Stage -->
    <main class="main-stage">
        <!-- Ambient stage background glow -->
        <div class="stage-backdrop-glow"></div>

        <!-- Floating Navigation Prev / Next Buttons -->
        <button onclick="prevPage()" id="btn-prev-float" class="nav-floating-btn nav-prev-btn" title="Previous Page (←)">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button onclick="nextPage()" id="btn-next-float" class="nav-floating-btn nav-next-btn" title="Next Page (→)">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <!-- 3D Flipbook Mount -->
        <div id="book-container">
            <div id="flipbook" class="flip-book">
                <!-- Pages injected dynamically by JavaScript -->
            </div>
        </div>

        <!-- Watermark -->
        <div class="bottom-watermark">Mohan Babu University • CSE Data Science Digital Library</div>

        <!-- Standard PDF View Container (Fallback) -->
        <div id="standard-pdf-container">
            <iframe id="standard-pdf-iframe" src=""></iframe>
        </div>
    </main>

    <!-- Instant Loading Screen Overlay (Dismisses in <250ms) -->
    <div id="loading-overlay">
        <div class="loading-icon-box">
            <i class="fa-solid fa-book-open"></i>
        </div>
        <div style="text-align: center;">
            <h3 class="loading-title">Opening 3D Flipbook...</h3>
            <p id="loading-status-text" class="loading-desc">Rendering page 1...</p>
        </div>
        <div class="loading-bar-track">
            <div id="loading-progress-bar" class="loading-bar-fill"></div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // 1. Parse URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        let pdfFile = urlParams.get('pdf') || urlParams.get('file') || 'Module1.pdf';
        let pdfTitle = urlParams.get('title') || 'Data Science Syllabus Module';

        pdfFile = decodeURIComponent(pdfFile);
        pdfTitle = decodeURIComponent(pdfTitle);

        document.getElementById('book-title').innerText = pdfTitle;
        document.title = `${pdfTitle} (Interactive Flipbook) - Data Science Digital Library`;

        const downloadBtn = document.getElementById('btn-download');
        downloadBtn.href = pdfFile;
        downloadBtn.download = pdfFile;

        let pageFlipInstance = null;
        let soundEnabled = true;
        let totalPdfPages = 0;
        let isStandardView = false;
        let isSinglePageMode = true; // Default: Single Page / Portrait View ("one page after another")
        let pdfDocGlobal = null;
        let renderedPages = new Set();

        // 2. Realistic Audio Synthesizer (Zero External Audio File Dependency)
        function playFlipSound() {
            if (!soundEnabled) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') ctx.resume();

                const bufferSize = Math.floor(ctx.sampleRate * 0.08);
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const decay = Math.exp(-i / (ctx.sampleRate * 0.02));
                    data[i] = (Math.random() * 2 - 1) * decay * 0.22;
                }

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1400;
                filter.Q.value = 1.5;

                noise.connect(filter);
                filter.connect(ctx.destination);
                noise.start();
            } catch(e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high';
                icon.style.color = '#2dd4bf';
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
                icon.style.color = '#64748b';
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                document.exitFullscreen().catch(() => {});
            }
        }

        function toggleStandardView() {
            const flipContainer = document.getElementById('book-container');
            const stdContainer = document.getElementById('standard-pdf-container');
            const floatPrev = document.getElementById('btn-prev-float');
            const floatNext = document.getElementById('btn-next-float');
            const btn = document.getElementById('btn-toggle-view');

            isStandardView = !isStandardView;
            if (isStandardView) {
                document.getElementById('standard-pdf-iframe').src = pdfFile;
                stdContainer.style.display = 'block';
                flipContainer.style.display = 'none';
                floatPrev.classList.add('hidden');
                floatNext.classList.add('hidden');
                btn.innerHTML = `<i class="fa-solid fa-book-open" style="color: #2dd4bf;"></i>`;
                btn.title = "Switch to 3D Flipbook Reader";
            } else {
                stdContainer.style.display = 'none';
                flipContainer.style.display = 'flex';
                floatPrev.classList.remove('hidden');
                floatNext.classList.remove('hidden');
                btn.innerHTML = `<i class="fa-solid fa-file-pdf" style="color: #fb7185;"></i>`;
                btn.title = "Switch to Standard PDF Viewer";
            }
        }

        function togglePageSpread() {
            isSinglePageMode = !isSinglePageMode;
            const label = document.getElementById('spread-label');
            const icon = document.getElementById('spread-icon');

            if (isSinglePageMode) {
                label.innerText = 'Single Page';
                icon.className = 'fa-solid fa-file';
            } else {
                label.innerText = 'Two Pages';
                icon.className = 'fa-solid fa-book-open';
            }

            // Re-mount flipbook with new orientation
            initPageFlip();
        }

        function prevPage() {
            if (pageFlipInstance) {
                pageFlipInstance.flipPrev();
            }
        }

        function nextPage() {
            if (pageFlipInstance) {
                pageFlipInstance.flipNext();
            }
        }

        // Keyboard navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
                nextPage();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevPage();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            }
        });

        // 3. Fast Asynchronous Single Page Renderer
        async function renderSinglePdfPage(pageNum) {
            if (renderedPages.has(pageNum) || !pdfDocGlobal) return;
            const canvas = document.getElementById(`page-canvas-${pageNum}`);
            if (!canvas) return;

            try {
                const page = await pdfDocGlobal.getPage(pageNum);
                // Balanced scale for crisp text readability
                const viewport = page.getViewport({ scale: 1.5 });
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                const ctx = canvas.getContext('2d');
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                renderedPages.add(pageNum);
            } catch(e) {
                console.warn(`Page ${pageNum} render notice:`, e);
            }
        }

        // 4. Initialize St.PageFlip
        function initPageFlip() {
            const flipbookEl = document.getElementById('flipbook');
            if (pageFlipInstance) {
                try { pageFlipInstance.destroy(); } catch(e) {}
            }

            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight - 64; // 64px header

            // Standard A4 aspect ratio 1 : 1.414 (w/h = 0.707)
            const availableHeight = containerHeight - 36;
            const availableWidth = containerWidth - 60;

            let targetHeight = Math.min(availableHeight, 840);
            let targetWidth = Math.round(targetHeight * 0.707);

            if (targetWidth > availableWidth * 0.90) {
                targetWidth = Math.round(availableWidth * 0.90);
                targetHeight = Math.round(targetWidth / 0.707);
            }

            if (isSinglePageMode) {
                // SINGLE PAGE PORTRAIT MODE ("One page after another")
                // Setting minWidth: 9999 ensures St.PageFlip internal orientation calculation evaluates:
                // (containerWidth < 2 * minWidth) -> ALWAYS TRUE -> orientation: 'portrait'!
                pageFlipInstance = new St.PageFlip(flipbookEl, {
                    width: targetWidth,
                    height: targetHeight,
                    size: 'stretch',
                    minWidth: 9999,
                    maxWidth: targetWidth,
                    minHeight: 300,
                    maxHeight: targetHeight,
                    maxShadowOpacity: 0.5,
                    showCover: false, // Single page mode flips page by page cleanly
                    mobileScrollSupport: false,
                    useMouseEvents: true,
                    clickEventForward: true,
                    usePortrait: true,
                    swipeDistance: 25
                });
            } else {
                // TWO PAGES LANDSCAPE SPREAD MODE
                let spreadWidth = Math.min(Math.round((availableWidth * 0.92) / 2), Math.round(targetHeight * 0.707));
                let spreadHeight = Math.round(spreadWidth / 0.707);

                pageFlipInstance = new St.PageFlip(flipbookEl, {
                    width: spreadWidth,
                    height: spreadHeight,
                    size: 'stretch',
                    minWidth: 200,
                    maxWidth: spreadWidth,
                    minHeight: 300,
                    maxHeight: spreadHeight,
                    maxShadowOpacity: 0.5,
                    showCover: true,
                    mobileScrollSupport: false,
                    useMouseEvents: true,
                    clickEventForward: true,
                    usePortrait: false,
                    swipeDistance: 25
                });
            }

            pageFlipInstance.loadFromHTML(document.querySelectorAll('.page'));

            pageFlipInstance.on('flip', (e) => {
                const currentIdx = e.data;
                document.getElementById('current-page').innerText = currentIdx + 1;
                playFlipSound();

                // Proactively pre-render next 3 pages in advance
                const targetPage = currentIdx + 1;
                for (let p = targetPage; p <= Math.min(targetPage + 3, totalPdfPages); p++) {
                    renderSinglePdfPage(p);
                }
            });

            pageFlipInstance.on('changeState', (e) => {
                if (e.data === 'flipping') {
                    playFlipSound();
                }
            });
        }

        // 5. Lightning Fast Initializer: Renders Page 1 immediately, opens book, streams rest in background!
        async function loadFlipbookFast() {
            const statusText = document.getElementById('loading-status-text');
            const progressBar = document.getElementById('loading-progress-bar');
            const flipbookEl = document.getElementById('flipbook');

            try {
                statusText.innerText = `Fetching ${pdfFile}...`;
                progressBar.style.width = '35%';
                
                const loadingTask = pdfjsLib.getDocument(pdfFile);
                pdfDocGlobal = await loadingTask.promise;
                totalPdfPages = pdfDocGlobal.numPages;
                document.getElementById('total-pages').innerText = totalPdfPages;

                flipbookEl.innerHTML = '';

                // Build lightweight page DOM shells instantly
                for (let i = 1; i <= totalPdfPages; i++) {
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    pageDiv.id = `page-wrapper-${i}`;

                    const pageContent = document.createElement('div');
                    pageContent.className = 'page-content';

                    const canvas = document.createElement('canvas');
                    canvas.id = `page-canvas-${i}`;
                    canvas.className = 'page-canvas';
                    pageContent.appendChild(canvas);

                    const pageFooter = document.createElement('div');
                    pageFooter.className = 'page-footer';
                    pageFooter.innerText = `Page ${i}`;
                    pageContent.appendChild(pageFooter);

                    pageDiv.appendChild(pageContent);
                    flipbookEl.appendChild(pageDiv);
                }

                statusText.innerText = 'Rendering Page 1...';
                progressBar.style.width = '70%';

                // Render Page 1 and Page 2 right now (< 200ms!)
                await renderSinglePdfPage(1);
                if (totalPdfPages > 1) {
                    await renderSinglePdfPage(2);
                }

                progressBar.style.width = '100%';
                statusText.innerText = 'Ready!';

                // Initialize 3D book immediately!
                initPageFlip();

                // Dismiss loading screen right away!
                setTimeout(() => {
                    const overlay = document.getElementById('loading-overlay');
                    if (overlay) {
                        overlay.style.transition = 'opacity 0.25s ease';
                        overlay.style.opacity = '0';
                        setTimeout(() => overlay.remove(), 250);
                    }
                }, 100);

                // Stream render remaining pages in background without blocking user
                (async function streamRemainingPages() {
                    for (let p = 3; p <= totalPdfPages; p++) {
                        await renderSinglePdfPage(p);
                        const cachedCount = renderedPages.size;
                        const statusEl = document.getElementById('background-cache-status');
                        if (statusEl && cachedCount < totalPdfPages) {
                            statusEl.innerText = `Pages ready: ${cachedCount}/${totalPdfPages} • One page after another mode`;
                        } else if (statusEl) {
                            statusEl.innerText = `All ${totalPdfPages} pages ready • Single page 3D mode`;
                        }
                    }
                })();

            } catch (err) {
                console.error("Flipbook error:", err);
                statusText.innerText = "Switching to standard PDF viewer...";
                setTimeout(() => {
                    toggleStandardView();
                    const overlay = document.getElementById('loading-overlay');
                    if (overlay) overlay.remove();
                }, 500);
            }
        }

        window.addEventListener('load', loadFlipbookFast);
        window.addEventListener('resize', () => {
            if (pageFlipInstance) {
                initPageFlip();
            }
        });
    </script>
</body>
